name: Instagram scan

on:
  # Schedule trigger disabled 2026-08-09: DataImpulse residential proxy
  # (SCRAPER_PROXY_URL) is out of purchased traffic (407 TRAFFIC_EXHAUSTED,
  # confirmed by curling the proxy directly) -- every scheduled run since
  # 2026-08-04 has failed at the proxy CONNECT step, burning CI minutes on a
  # guaranteed failure. Not a code bug -- nothing here can fix a billing
  # issue on the proxy provider's end. publish.yml is unaffected (Graph API,
  # no proxy) and still has a ~100-post ready queue to draw from. Re-add the
  # `schedule:` block below once the DataImpulse balance is topped up:
  #   schedule:
  #     - cron: "0 */3 * * *"
  workflow_dispatch: {} # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write # needed to commit the updated database/downloads back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Firefox system dependencies (for Camoufox)
        run: python -m playwright install-deps firefox

      - name: Cache Camoufox browser binary
        # ~530MB and versioned by the installed camoufox package, so this only
        # actually re-downloads when requirements.txt bumps the camoufox pin.
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-bin-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Fetch Camoufox browser binary (no-op if cache hit)
        run: python -m camoufox fetch

      - name: Run check (scrape recent posts)
        env:
          # Scraping is anonymous (Camoufox renders real logged-out browser
          # pages) -- no Instagram login/session needed. Routes through a
          # residential proxy since GitHub's shared runner IPs get flagged by
          # Instagram at the request level regardless of auth.
          #
          # Uses --backfill, not --check: --check only looks at each account's
          # single latest post, so a cycle that finds nothing "new" there adds
          # nothing to the queue even if the account posted multiple times
          # since our last successful scrape (proxy reliability means cycles
          # can silently miss accounts -- see CONTEXT.md 2026-07-11).
          # --backfill inspects the last few posts per account and skips
          # anything already in the database (posts.shortcode is UNIQUE), so
          # it never re-downloads or re-publishes the same post twice, but
          # still picks up anything recent that an earlier cycle missed.
          SCRAPER_PROXY_URL: ${{ secrets.SCRAPER_PROXY_URL }}
          TESSERACT_PATH: /usr/bin/tesseract
        run: python main.py --backfill --backfill-count 3

      - name: Run prepare (OCR + caption prep)
        env:
          TESSERACT_PATH: /usr/bin/tesseract
        run: python main.py --prepare

      - name: Commit and push newly downloaded media
        # The Graph API (in the separate publish workflow) fetches images from
        # MEDIA_PUBLIC_BASE_URL itself, so a raw.githubusercontent.com URL only
        # works once the file has actually been pushed here. (Requires this repo
        # to be public, or MEDIA_PUBLIC_BASE_URL to point at a different public host.)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add database/app.db downloads/
          git diff --staged --quiet || git commit -m "Automated scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase && git push

      # Publishing lives in a SEPARATE workflow (.github/workflows/publish.yml)
      # that runs only at fixed daytime IST slots, so nothing gets posted in the
      # middle of the night. This scan workflow only scrapes/prepares content and
      # commits it to the repo for that publish workflow to pick up. Prepare also
      # screens captions for blocked keywords, so anything explicit is marked
      # 'rejected' here and never reaches the publish queue.
